name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate data and check README tables
        run: node scripts/build.mjs --check
      - name: Tests
        run: node --test
