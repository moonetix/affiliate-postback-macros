name: Source watch

on:
  schedule:
    - cron: '41 4 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Opens or updates the "Vendor docs changed" issue before the new hashes
      # are committed, so a failed commit never loses a report.
      - name: Fetch every cited page and compare with data/source-hashes.json
        run: node scripts/watch-sources.mjs --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated hashes
        run: |
          if git diff --quiet -- data/source-hashes.json; then
            echo "Hashes unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-hashes.json
          git commit -m "Update source hashes ($(date -u +%Y-%m-%d))"
          git push || { git pull --rebase && git push; }

      - name: Close the failure issue
        if: success()
        run: node scripts/github-issue.mjs close --topic source-watch-failed --comment "The source watch ran cleanly again."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report a failed run
        if: failure()
        run: |
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The monthly source watch failed, so vendor doc changes are not being tracked.

          Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Run it locally with \`node scripts/watch-sources.mjs --no-write\` to see the error. This issue closes itself after the next clean run.
          EOF
          node scripts/github-issue.mjs upsert --topic source-watch-failed --title "Source watch failed" --body-file "$RUNNER_TEMP/body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repository activity.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/source-watch.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
